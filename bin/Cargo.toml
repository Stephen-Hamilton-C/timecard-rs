[package]
name = "timecard-cli"
version = "0.1.0"
edition = "2024"
description = "Helps you keep track of how long you've worked each day"
readme = "../README.md"

[[bin]]
name = "timecard"
path = "src/main.rs"

[dependencies]
timecard = { path = "../lib" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.149"
clap = { version = "4.5.60", features = ["derive"] }
toml = "1.0.4"
colored = "3.1.1"
platform-dirs = "0.3.0"
humantime = "2.3.0"
serde_valid = "2.0.1"
anyhow = "1.0.102"
